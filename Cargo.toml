[package]
name = "heracles"
version = "0.1.0"
edition = "2024"
description = "Semantic folder search from the command line"
license = "MIT"
readme = "README.md"
keywords = ["search", "semantic", "embeddings", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "heracles"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
grep = "0.4"
ignore = "0.4"
memmap2 = "0.9"
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
